<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Iki Das Anti Theft Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f1f5f9; }
    header { background: #1e293b; color: white; padding: 14px 16px; font-size: 18px; font-weight: 600; }
    #map { height: 55vh; width: 100%; }
    .card { background: white; margin: 12px; border-radius: 10px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card h3 { font-size: 13px; color: #64748b; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .05em; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; }
    button { flex: 1; min-width: 120px; padding: 10px 8px; font-size: 14px; border: none; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #475569; }
    #status { font-size: 13px; color: #475569; margin-top: 10px; }
    .report-item { padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
    .report-item:last-child { border-bottom: none; }
    .report-item a { color: #2563eb; text-decoration: none; font-weight: 500; }
    .report-meta { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    #login-screen { position: fixed; inset: 0; background: #1e293b; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 999; }
    #login-screen input { padding: 10px 14px; border-radius: 8px; border: none; width: 260px; font-size: 15px; }
    #login-screen button { flex: none; width: 260px; padding: 12px; font-size: 15px; }
    #login-error { color: #fca5a5; font-size: 13px; }
    #push-banner { background: #fef3c7; border: 1px solid #fcd34d; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; display: none; }
  </style>
</head>
<body>

  <!-- Login (Besitzer-Auth via Supabase) -->
  <div id="login-screen">
    <div style="color:white;font-size:20px;font-weight:600">📍 Iki Anti Theft</div>
    <input id="email"    type="email"    placeholder="E-Mail" />
    <input id="password" type="password" placeholder="Passwort" />
    <button onclick="login()">Einloggen</button>
    <div id="login-error"></div>
  </div>

  <header>📍 Iki Das Anti Theft Tool</header>
  <div id="map"></div>

  <div class="card">
    <h3>Steuerung</h3>
    <div id="push-banner">
      🔔 Push-Benachrichtigungen für Tagesberichte aktivieren.
      <button onclick="registerWebPush()" style="margin-top:8px;flex:none;min-width:auto;padding:6px 12px;font-size:13px;">Aktivieren</button>
    </div>
    <div class="controls">
      <button onclick="trigger('photo')">📷 Foto</button>
      <button onclick="trigger('audio')">🎙️ Audio (10s)</button>
      <button onclick="trigger('location')">📍 Standort</button>
    </div>
    <div id="status">Bereit.</div>
  </div>

  <div class="card">
    <h3>App-Nutzung gestern</h3>
    <div id="usage-list"><em style="color:#94a3b8;font-size:13px;">Wird geladen…</em></div>
  </div>

  <div class="card">
    <div id="reports-list"><em style="color:#94a3b8;font-size:13px;">Wird geladen…</em></div>
  </div>

  <script type="module">
    // TODO: Supabase-Werte eintragen (Project Settings → API)
    const SUPABASE_URL      = "https://ywrhhuhadgtmdzldbawa.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_XewJO51CVSpz2fVlHPLrbQ_Yj6OWixg";

    // TODO: Firebase-Config für Web-Push eintragen
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAT_Ggfx13HUyiFlRSIMqcPFHnkSI6z9h0",
      authDomain: "iki-anti-theft.firebaseapp.com",
      projectId: "iki-anti-theft",
      storageBucket: "iki-anti-theft.firebasestorage.app",
      messagingSenderId: "472144471117",
      appId: "1:472144471117:web:47e2f30ed040b58b55a804",
    };
    const VAPID_KEY   = "TODO_VAPID_KEY";
    const DEVICE_ID   = "phone-1";
    // TODO: Edge Function URL (Supabase Dashboard → Edge Functions)
    const EDGE_URL    = "https://ywrhhuhadgtmdzldbawa.supabase.co/functions/v1/send-command";

    // ── Supabase Client ─────────────────────────────────────────────────────
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import { initializeApp }     from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const fbApp    = initializeApp(FIREBASE_CONFIG);
    const messaging = getMessaging(fbApp);

    let authToken = null;

    // ── Login ───────────────────────────────────────────────────────────────
    window.login = async function () {
      const email    = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        document.getElementById("login-error").textContent = "Fehler: " + error.message;
        return;
      }
      authToken = data.session.access_token;
      document.getElementById("login-screen").style.display = "none";
      init();
    };

    async function init() {
      if (Notification.permission !== "granted") {
        document.getElementById("push-banner").style.display = "block";
      }
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/firebase-messaging-sw.js");
      }
      loadMap();
      loadReports();
      loadUsageStats();
      subscribeLocationUpdates();

      onMessage(messaging, payload => {
        const { title, body } = payload.notification;
        document.getElementById("status").textContent = `🔔 ${title}: ${body}`;
      });
    }

    // ── Karte ───────────────────────────────────────────────────────────────
    let map, marker;
    window.initMap = function () {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 51.5, lng: 7.0 }, zoom: 12,
        mapTypeControl: false, streetViewControl: false,
      });
    };

    function loadMap() {
      // Letzten Standort laden
      supabase.from("locations")
        .select("lat, lng, timestamp")
        .eq("device_id", DEVICE_ID)
        .order("timestamp", { ascending: false })
        .limit(1)
        .then(({ data }) => {
          if (data?.length) updateMarker(data[0]);
        });
    }

    function subscribeLocationUpdates() {
      supabase.channel("locations")
        .on("postgres_changes", {
          event: "INSERT", schema: "public", table: "locations",
          filter: `device_id=eq.${DEVICE_ID}`
        }, payload => updateMarker(payload.new))
        .subscribe();
    }

    function updateMarker({ lat, lng }) {
      const pos = { lat, lng };
      if (!marker) marker = new google.maps.Marker({ position: pos, map });
      else marker.setPosition(pos);
      map.panTo(pos);
    }

    // ── Steuerung ───────────────────────────────────────────────────────────
    window.trigger = async function (command) {
      document.getElementById("status").textContent = `⏳ Sende ${command}…`;
      try {
        const res = await fetch(EDGE_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${authToken}`,
          },
          body: JSON.stringify({ deviceId: DEVICE_ID, command }),
        });
        const json = await res.json();
        document.getElementById("status").textContent =
          json.success ? `✅ "${command}" gesendet.` : `❌ ${json.error}`;
      } catch (err) {
        document.getElementById("status").textContent = `❌ Fehler: ${err.message}`;
      }
    };

    // ── Web-Push registrieren ───────────────────────────────────────────────
    window.registerWebPush = async function () {
      try {
        const token = await getToken(messaging, { vapidKey: VAPID_KEY });
        await supabase.from("owner").upsert({
          id: "dashboard", fcm_token: token, registered_at: Date.now()
        });
        document.getElementById("push-banner").style.display = "none";
        document.getElementById("status").textContent = "✅ Push aktiviert – Bericht täglich um 03:00 Uhr.";
      } catch (err) {
        document.getElementById("status").textContent = `❌ Push-Fehler: ${err.message}`;
      }
    };

    // ── App-Nutzungsstatistiken ─────────────────────────────────────────────
    async function loadUsageStats() {
      const yesterday = new Date(Date.now() - 86400000).toISOString().split("T")[0];
      const { data } = await supabase
        .from("usage_logs")
        .select("app_name, app_package, total_time_ms")
        .eq("device_id", DEVICE_ID)
        .eq("date", yesterday)
        .order("total_time_ms", { ascending: false })
        .limit(15);

      const list = document.getElementById("usage-list");
      if (!data?.length) {
        list.innerHTML = '<em style="color:#94a3b8;font-size:13px;">Noch keine Daten für gestern.</em>';
        return;
      }

      const maxTime = data[0].total_time_ms;
      list.innerHTML = data.map(u => {
        const mins  = Math.round(u.total_time_ms / 60000);
        const hours = mins >= 60 ? `${Math.floor(mins/60)}h ${mins%60}Min` : `${mins} Min`;
        const pct   = Math.round((u.total_time_ms / maxTime) * 100);
        const name  = u.app_name || u.app_package;
        return `<div class="report-item">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span>${name}</span><span style="color:#64748b;font-size:13px">${hours}</span>
          </div>
          <div style="background:#f1f5f9;border-radius:4px;height:6px">
            <div style="background:#2563eb;border-radius:4px;height:6px;width:${pct}%"></div>
          </div>
        </div>`;
      }).join("");
    }

    // ── Tagesberichte ───────────────────────────────────────────────────────
    async function loadReports() {
      const { data } = await supabase
        .from("reports")
        .select("*")
        .eq("device_id", DEVICE_ID)
        .order("date", { ascending: false })
        .limit(7);

      const list = document.getElementById("reports-list");
      if (!data?.length) {
        list.innerHTML = '<em style="color:#94a3b8;font-size:13px;">Noch keine Berichte vorhanden.</em>';
        return;
      }
      list.innerHTML = data.map(r => {
        const fmt = ts => ts ? new Date(ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : "–";
        const link = r.maps_url ? `<a href="${r.maps_url}" target="_blank">→ Route öffnen</a>` : "";
        return `<div class="report-item">
          <strong>${r.date}</strong> – ${r.location_count} Standorte ${link}
          <div class="report-meta">${fmt(r.first_timestamp)} – ${fmt(r.last_timestamp)} Uhr</div>
        </div>`;
      }).join("");
    }
  </script>

  <!-- TODO: eigenen Google Maps API-Key eintragen -->
  <script src="https://maps.googleapis.com/maps/api/js?key=TODO&callback=initMap" async defer></script>
</body>
</html>
