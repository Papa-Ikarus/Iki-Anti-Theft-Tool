// ── Web-Push / Firebase Cloud Messaging ────────────────────────────────
window.registerWebPush = async function () {
  try {
    console.log("🔔 Starte Web-Push-Registrierung...");

    // 1. Notification Permission prüfen
    if (Notification.permission !== "granted") {
      console.log("🔔 Fordere Notification-Berechtigung an...");

      const permission = await Notification.requestPermission();

      console.log("Notification Permission:", permission);

      if (permission !== "granted") {
        throw new Error(
          "Benachrichtigungsberechtigung wurde nicht erteilt."
        );
      }
    }

    // 2. Firebase Messaging Service Worker holen
    console.log("🔧 Suche Firebase Messaging Service Worker...");

    const swRegistration =
      await navigator.serviceWorker.getRegistration("/");

    if (!swRegistration) {
      throw new Error(
        "Firebase Messaging Service Worker wurde nicht gefunden."
      );
    }

    console.log("✅ Verwende Service Worker:", {
      scope: swRegistration.scope,
      scriptURL: swRegistration.active?.scriptURL,
      state: swRegistration.active?.state
    });

    // 3. Service Worker muss aktiv sein
    await navigator.serviceWorker.ready;

    console.log("✅ Service Worker ready");

    // 4. Vorhandene Push-Subscription prüfen
    const existingSubscription =
      await swRegistration.pushManager.getSubscription();

    console.log(
      "Bestehende Push-Subscription:",
      existingSubscription
    );

    // 5. FCM Token holen
    console.log("🔑 Fordere FCM Token an...");

    const token = await getToken(messaging, {
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration: swRegistration
    });

    console.log("✅ getToken() erfolgreich");
    console.log("FCM Token vorhanden:", !!token);
    console.log("FCM Token Länge:", token?.length);

    if (!token) {
      throw new Error(
        "Firebase hat keinen FCM Token zurückgegeben."
      );
    }

    // 6. Token in Supabase speichern
    console.log("💾 Speichere FCM Token in owner...");

    const { data, error } = await supabase
      .from("owner")
      .upsert({
        id: "dashboard",
        fcm_token: token,
        registered_at: Date.now()
      })
      .select();

    console.log("Owner-Upsert:", {
      data,
      error
    });

    if (error) {
      throw new Error(
        `Owner-Upsert fehlgeschlagen: ${error.message}`
      );
    }

    // 7. Push-Banner ausblenden
    document.getElementById("push-banner").style.display = "none";

    document.getElementById("status").textContent =
      "✅ Push aktiviert.";

    console.log("🎉 Web-Push erfolgreich aktiviert!");

  } catch (err) {
    console.error(
      "❌ Web-Push-Registrierung fehlgeschlagen:",
      err
    );

    console.error("Push-Debug:", {
      notificationPermission: Notification.permission,
      vapidKeyPresent: !!VAPID_KEY,
      vapidKeyLength: VAPID_KEY?.length,
      firebaseProjectId: FIREBASE_CONFIG.projectId,
      firebaseMessagingSenderId: FIREBASE_CONFIG.messagingSenderId
    });

    document.getElementById("status").textContent =
      `❌ ${err.name || "Fehler"}: ${err.message}`;
  }
};

    async function loadLocationHistory(deviceId) {
  const since = Date.now() - 24 * 60 * 60 * 1000;

  const { data, error } = await supabase
    .from("locations")
    .select("lat, lng, timestamp")
    .eq("device_id", deviceId)
    .gte("timestamp", since)
    .order("timestamp", { ascending: true });

  if (error) {
    console.error("❌ Standort-Historie konnte nicht geladen werden:", error);
    return;
  }

  if (!data || data.length < 2) return;

  const deviceIndex = allDevices.findIndex(d => d.id === deviceId);
  const color =
    DEVICE_COLORS[deviceIndex >= 0 ? deviceIndex % DEVICE_COLORS.length : 0];

  // Alte Route entfernen
  if (routeLayers[deviceId]) {
    map.removeLayer(routeLayers[deviceId]);
    delete routeLayers[deviceId];
  }

  // Alte Historienmarker entfernen
  if (historyMarkers[deviceId]) {
    historyMarkers[deviceId].forEach(marker => map.removeLayer(marker));
  }

  historyMarkers[deviceId] = [];

  // Route
  const coords = data.map(p => [p.lat, p.lng]);

  routeLayers[deviceId] = L.polyline(coords, {
    color,
    weight: 3,
    opacity: 0.7,
    dashArray: "6,4"
  }).addTo(map);

  // Historienpunkte
  historyMarkers[deviceId] = data.map(p => {
    const date = new Date(p.timestamp);

    const time = date.toLocaleTimeString("de-DE", {
      hour: "2-digit",
      minute: "2-digit"
    });

    const dateText = date.toLocaleDateString("de-DE");

    return L.circleMarker([p.lat, p.lng], {
      radius: 4,
      color,
      fillColor: color,
      fillOpacity: 0.8,
      weight: 1
    })
      .bindPopup(`
        <strong>📍 Standort</strong><br>
        🕐 ${dateText} ${time} Uhr<br>
        📌 ${Number(p.lat).toFixed(5)}, ${Number(p.lng).toFixed(5)}
      `)
      .addTo(map);
  });

  // Startpunkt separat markieren
  const first = data[0];
  const startDate = new Date(first.timestamp);

  const startTime = startDate.toLocaleTimeString("de-DE", {
    hour: "2-digit",
    minute: "2-digit"
  });

  const startMarker = L.circleMarker(
    [first.lat, first.lng],
    {
      radius: 7,
      color: "#16a34a",
      fillColor: "#16a34a",
      fillOpacity: 1,
      weight: 2
    }
  )
    .bindPopup(`
      <strong>🟢 Startpunkt</strong><br>
      🕐 ${startTime} Uhr<br>
      📌 ${Number(first.lat).toFixed(5)}, ${Number(first.lng).toFixed(5)}
    `)
    .addTo(map);

  historyMarkers[deviceId].push(startMarker);

  // Karte nur beim erstmaligen Laden des ausgewählten Geräts anpassen.
  // Bei späteren Realtime-Updates soll die Karte nicht ständig springen.
  if (selectedDevice === deviceId && !map._ikiHistoryInitialized?.[deviceId]) {
    map.fitBounds(routeLayers[deviceId].getBounds(), {
      padding: [30, 30]
    });

    if (!map._ikiHistoryInitialized) {
      map._ikiHistoryInitialized = {};
    }

    map._ikiHistoryInitialized[deviceId] = true;
  }
}

    className: "",

}
async function focusLatestLocation(deviceId) {
  const { data, error } = await supabase
    .from("locations")
    .select("lat, lng, timestamp")
    .eq("device_id", deviceId)
    .order("timestamp", { ascending: false })
    .limit(1);

  if (error) {
    console.error(
      "❌ Aktueller Standort konnte nicht geladen werden:",
      error
    );
    return false;
  }

  if (!data?.length) {
    console.warn(
      "⚠️ Kein Standort für Gerät gefunden:",
      deviceId
    );
    return false;
  }

  const location = data[0];
  const lat = Number(location.lat);
  const lng = Number(location.lng);

  if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
    console.warn(
      "⚠️ Ungültige Standortkoordinaten:",
      location
    );
    return false;
  }

  updateMarker(deviceId, lat, lng);

  map.setView([lat, lng], 17, {
    animate: true
  });

  markers[deviceId]?.openPopup();

  return true;
}
    function updateMarker(deviceId, lat, lng) {
  const deviceIndex = allDevices.findIndex(d => d.id === deviceId);
  const color =
    DEVICE_COLORS[deviceIndex >= 0 ? deviceIndex % DEVICE_COLORS.length : 0];

  const device = allDevices.find(d => d.id === deviceId);
  const deviceName = device?.id || deviceId;

  const now = new Date().toLocaleString("de-DE", {
    dateStyle: "short",
    timeStyle: "short"
  });

  const popup = `
    <strong>📍 Aktueller Standort</strong><br>
    📱 ${deviceName}<br>
    🕐 ${now} Uhr<br>
    📌 ${Number(lat).toFixed(5)}, ${Number(lng).toFixed(5)}
  `;

  if (!markers[deviceId]) {
    markers[deviceId] = L.marker(
      [lat, lng],
      { icon: getMarkerIcon(color) }
    )
      .addTo(map)
      .bindPopup(popup);
  } else {
    markers[deviceId].setLatLng([lat, lng]);
    markers[deviceId].setPopupContent(popup);
  }

  // Nur beim aktuell ausgewählten Gerät bewegen,
  // wenn die neue Position außerhalb des sichtbaren Bereichs liegt.
  if (selectedDevice === deviceId) {
    const newPosition = L.latLng(lat, lng);
    const bounds = map.getBounds();

    if (!bounds.contains(newPosition)) {
      map.panTo(newPosition, {
        animate: true,
        duration: 0.5
      });
    }
  }
}

async function loadDevices() {
  const { data } = await supabase.from("devices").select("id, last_seen");
  allDevices = data ?? [];

  const tabs = document.getElementById("device-tabs");
  if (!allDevices.length) {
    tabs.innerHTML = '<em style="color:#94a3b8;font-size:13px;">Noch keine Geräte registriert.</em>';
    return;
  }

  tabs.innerHTML = allDevices.map((d, i) => {
    const color = DEVICE_COLORS[i % DEVICE_COLORS.length];

    const ago = d.last_seen
      ? Math.round((Date.now() - d.last_seen) / 60000)
      : null;

    const time = ago !== null
      ? (ago < 60 ? `${ago} Min.` : `${Math.round(ago / 60)} Std.`)
      : "–";

    // Live-Status anhand von last_seen
    let statusColor;
    let statusText;

    if (ago !== null && ago < 2) {
      statusColor = "#22c55e";
      statusText = "Online";
    } else if (ago !== null && ago < 10) {
      statusColor = "#f59e0b";
      statusText = "Zuletzt gesehen";
    } else {
      statusColor = "#ef4444";
      statusText = "Offline";
    }

    return `<button class="device-tab" onclick="selectDevice('${d.id}')" id="tab-${d.id}">
      <span class="device-dot" style="background:${statusColor}"></span>${d.id}<br>
      <span class="device-status" style="font-size:11px;opacity:.7">${statusText} · zuletzt: ${time}</span>
    </button>`;
  }).join("");

  // Erstes Gerät automatisch auswählen
  selectDevice(allDevices[0].id);

  // Letzte Standorte aller Geräte auf Karte zeigen
  for (const d of allDevices) {
    const { data: locs } = await supabase.from("locations")
      .select("lat, lng").eq("device_id", d.id)
      .order("timestamp", { ascending: false }).limit(1);

    if (locs?.length) updateMarker(d.id, locs[0].lat, locs[0].lng);
  }
}
// ── Live-Gerätestatus automatisch aktualisieren ───────────────────────
let liveStatusTimer = null;

function startLiveStatusRefresh() {
  if (liveStatusTimer) {
    clearInterval(liveStatusTimer);
  }

  liveStatusTimer = setInterval(async () => {
    if (!authToken) return;

    try {
      const { data, error } = await supabase
        .from("devices")
        .select("id, last_seen");

      if (error) throw error;

      const devices = data ?? [];

      for (const d of devices) {
        const tab = document.getElementById(`tab-${d.id}`);
        if (!tab) continue;

        const dot = tab.querySelector(".device-dot");
        const statusElement = tab.querySelector(".device-status");

        const ago = d.last_seen
          ? Math.round((Date.now() - d.last_seen) / 60000)
          : null;

        const time = ago !== null
          ? (ago < 60
              ? `${ago} Min.`
              : `${Math.round(ago / 60)} Std.`)
          : "–";

        let statusColor;
        let statusText;

        if (ago !== null && ago < 2) {
          statusColor = "#22c55e";
          statusText = "Online";
        } else if (ago !== null && ago < 10) {
          statusColor = "#f59e0b";
          statusText = "Zuletzt gesehen";
        } else {
          statusColor = "#ef4444";
          statusText = "Offline";
        }

        if (dot) {
          dot.style.background = statusColor;
        }

        if (statusElement) {
          statusElement.textContent =
            `${statusText} · zuletzt: ${time}`;
        }
      }

      allDevices = devices;

    } catch (err) {
      console.error("❌ Live-Status Aktualisierung fehlgeschlagen:", err);
    }
  }, 60000);
}

      selectedDevice = deviceId;
      document.querySelectorAll(".device-tab").forEach(t => t.classList.remove("active"));
      document.getElementById(`tab-${deviceId}`)?.classList.add("active");
      document.getElementById("status").textContent = `Gerät: ${deviceId}`;
      loadReports();
      loadUsageStats();
      loadLocationHistory(deviceId);
      if (markers[deviceId]) map.panTo(markers[deviceId].getLatLng());
    };

    // ── Echtzeit-Updates ────────────────────────────────────────────────────
let routeLoading = {};

function subscribeLocationUpdates() {
  supabase.channel("locations-all")
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "locations"
      },
      async payload => {
        const {
          device_id,
          lat,
          lng
        } = payload.new;

        updateMarker(device_id, lat, lng);

        // Nur die Route des ausgewählten Geräts sofort aktualisieren.
        if (selectedDevice === device_id && !routeLoading[device_id]) {
          routeLoading[device_id] = true;

          try {
            await loadLocationHistory(device_id);
          } finally {
            routeLoading[device_id] = false;
          }
        }
      }
    )
    .subscribe();
}

    // ── Steuerung ───────────────────────────────────────────────────────────
    window.trigger = async function (command) {
  if (!selectedDevice) {
    document.getElementById("status").textContent =
      "⚠️ Erst ein Gerät auswählen";
    return;
  }

  document.getElementById("status").textContent =
    `⏳ Sende ${command} an ${selectedDevice}…`;

  try {
    const res = await fetch(EDGE_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${authToken}`
      },
      body: JSON.stringify({
        deviceId: selectedDevice,
        command
      }),
    });

    const json = await res.json();

    if (!json.success) {
      document.getElementById("status").textContent =
        `❌ ${json.error}`;
      return;
    }

    document.getElementById("status").textContent =
      `✅ "${command}" → ${selectedDevice}`;

    // Nach einem Standort-Befehl den neuesten Standort laden
    if (command === "location") {
      let found = false;

      for (let i = 0; i < 6; i++) {
        await new Promise(resolve => setTimeout(resolve, 1500));

        found = await focusLatestLocation(selectedDevice);

        if (found) {
          break;
        }
      }

      if (found) {
        document.getElementById("status").textContent =
          `📍 Aktueller Standort von ${selectedDevice}`;
      } else {
        document.getElementById("status").textContent =
          `⚠️ Standortbefehl gesendet, aber noch kein neuer Standort verfügbar`;
      }
    }

  } catch (err) {
    document.getElementById("status").textContent =
      `❌ ${err.message}`;
  }
};

    
window.refreshDashboard = async function () {
  if (!authToken || !selectedDevice) {
    document.getElementById("status").textContent =
      "⚠️ Erst ein Gerät auswählen";
    return;
  }

  document.getElementById("status").textContent =
    "🔄 Aktualisiere Dashboard…";

  try {
    await loadDevices();
    await loadReports();
    await loadUsageStats();
    await loadLocationHistory(selectedDevice);

    document.getElementById("status").textContent =
      `✅ Aktualisiert – ${new Date().toLocaleTimeString("de-DE")}`;
  } catch (err) {
    document.getElementById("status").textContent =
      `❌ Aktualisierung fehlgeschlagen: ${err.message}`;
  }
};

// ── App-Nutzung ─────────────────────────────────────────────────────────
let selectedUsageDay = "today";

window.selectUsageDay = async function(day) {
  selectedUsageDay = day;

  const todayBtn = document.getElementById("usage-today-btn");
  const yesterdayBtn = document.getElementById("usage-yesterday-btn");

  if (todayBtn && yesterdayBtn) {
    todayBtn.style.background =
      day === "today" ? "#2563eb" : "#475569";

    yesterdayBtn.style.background =
      day === "yesterday" ? "#2563eb" : "#475569";
  }

  await loadUsageStats();
};

function getLocalDate(offsetDays = 0) {
  const date = new Date();
  date.setDate(date.getDate() + offsetDays);

  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

async function loadUsageStats() {
  if (!selectedDevice) return;

  const usageDate =
    selectedUsageDay === "today"
      ? getLocalDate(0)
      : getLocalDate(-1);

  console.log(
    "App-Nutzung laden:",
    "device=",
    selectedDevice,
    "date=",
    usageDate
  );

  const { data, error } = await supabase
    .from("usage_logs")
    .select(
      "app_name, app_package, total_time_ms, first_time_used, last_used"
    )
    .eq("device_id", selectedDevice)
    .eq("date", usageDate)
    .order("total_time_ms", { ascending: false })
    .limit(15);

  const list = document.getElementById("usage-list");

  if (!list) {
    console.error("usage-list nicht gefunden");
    return;
  }

  if (error) {
    console.error("Fehler beim Laden der App-Nutzung:", error);

    list.innerHTML =
      '<em style="color:#ef4444;font-size:13px;">Fehler beim Laden.</em>';

    return;
  }

  if (!data?.length) {
    list.innerHTML =
      `<em style="color:#94a3b8;font-size:13px;">
        Keine App-Nutzungsdaten für ${usageDate}.
      </em>`;

    return;
  }

  console.log(
    `App-Nutzung geladen: ${data.length} Einträge für ${usageDate}`
  );

  const max = data[0].total_time_ms || 1;

  function fmt(ts) {
    if (!ts) return null;

    return new Date(Number(ts)).toLocaleTimeString("de-DE", {
      timeZone: "Europe/Berlin",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  list.innerHTML = data.map(u => {
    const totalMs = Number(u.total_time_ms) || 0;
    const totalSeconds = totalMs / 1000;
    const totalMinutes = totalMs / 60000;

    let time;

    if (totalSeconds < 1) {
      time = `${Math.round(totalMs)} ms`;
    } else if (totalSeconds < 60) {
      time = `${Math.round(totalSeconds)} Sek.`;
    } else {
      const mins = Math.round(totalMinutes);

      time =
        mins >= 60
          ? `${Math.floor(mins / 60)}h ${mins % 60} Min`
          : `${mins} Min`;
    }

    const pct = Math.round(
      (totalMs / max) * 100
    );

    const first = fmt(u.first_time_used);
    const last = fmt(u.last_used);

    let times = "";

    if (first && last) {
      times = `
        <div style="color:#94a3b8;font-size:11px;margin-top:2px">
          🕐 ${first} – ${last} Uhr
        </div>
      `;
    }

    return `
      <div class="report-item">
        <div style="display:flex;justify-content:space-between;margin-bottom:2px">
          <span>${u.app_name || u.app_package}</span>
          <span style="color:#64748b;font-size:13px">${time}</span>
        </div>

        ${times}

        <div style="background:#f1f5f9;border-radius:4px;height:6px;margin-top:4px">
          <div
            style="
              background:#2563eb;
              border-radius:4px;
              height:6px;
              width:${pct}%
            "
          ></div>
        </div>
      </div>
    `;
  }).join("");
}



    // ── Tagesberichte ────────────────────────────────────────────────────────
    async function loadReports() {
      if (!selectedDevice) return;
      const { data } = await supabase.from("reports")
        .select("*").eq("device_id", selectedDevice)
        .order("date", { ascending: false }).limit(7);

      const list = document.getElementById("reports-list");
      if (!data?.length) { list.innerHTML = '<em style="color:#94a3b8;font-size:13px;">Noch keine Berichte.</em>'; return; }
      const fmt = ts => ts ? new Date(ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : "–";
      list.innerHTML = data.map(r => `
        <div class="report-item">
          <strong>${r.date}</strong> – ${r.location_count} Standorte
          ${r.maps_url ? `<a href="${r.maps_url}" target="_blank"> → Route</a>` : ""}
          <div class="report-meta">${fmt(r.first_timestamp)} – ${fmt(r.last_timestamp)} Uhr</div>
        </div>`).join("");
    }
    restoreSession();
  </script>
